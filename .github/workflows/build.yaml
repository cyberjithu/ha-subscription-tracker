name: Build add-on images

# Builds the add-on per platform and publishes ghcr.io/cyberjithu/{arch}-subtracker:<version>.
# Home Assistant then pulls the image for its own architecture instead of building on the device.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, aarch64, amd64]
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - name: Skip platforms that were not chosen
        id: pick
        run: |
          chosen="${{ github.event.inputs.platform || 'all' }}"
          if [ "$chosen" = all ] || [ "$chosen" = "${{ matrix.arch }}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.pick.outputs.run
      - uses: docker/setup-qemu-action@v4
        if: steps.pick.outputs.run && matrix.arch == 'aarch64'
      - uses: docker/setup-buildx-action@v4
        if: steps.pick.outputs.run
      - uses: docker/login-action@v4
        if: steps.pick.outputs.run
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.pick.outputs.run
        run: scripts/build.sh ${{ matrix.arch }} --push
