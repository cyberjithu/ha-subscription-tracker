# Germany provider catalog, bundled with the add-on.
# Loaded on every start: new providers are added and unedited bundled ones are refreshed.
# Anything you edit, add or hide in the app is kept as you left it.
#
# Switching info is general guidance, not your contract: always check your own terms.
# Plans/prices are left empty on purpose; they go stale fast and are refreshed by the AI deal finder.
# Household waste is collected by the municipality (Abfallgebühren), so there are no bin companies to compare.
captured_at: 2026-11-03

country:
  code: DE
  name: Germany
  currency: EUR
  settings:
    switch_sites:
      - name: Check24
        url: https://www.check24.de/
      - name: Verivox
        url: https://www.verivox.de/
    regulators:
      telecoms: { name: Bundesnetzagentur, url: https://www.bundesnetzagentur.de/DE/Vportal/start.html }
      energy: { name: Bundesnetzagentur, url: https://www.bundesnetzagentur.de/DE/Vportal/start.html }
      consumer: { name: Verbraucherzentrale, url: https://www.verbraucherzentrale.de/ }
    medicine_note: >-
      Statutory health insurance co-payment (Zuzahlung) is usually 10% of the price, at least 5 € and at most
      10 € per item. Above 2% of yearly household gross income (1% for chronic illness) you can apply to your
      Krankenkasse for an exemption for the rest of the year.

categories:
  - { slug: broadband, name: Broadband, icon: mdi:router-wireless }
  - { slug: mobile, name: Mobile, icon: mdi:cellphone }
  - { slug: electricity, name: Electricity, icon: mdi:flash }
  - { slug: gas, name: Gas, icon: mdi:fire }
  - { slug: streaming, name: Streaming & TV, icon: mdi:television-play }
  - { slug: software, name: Software & AI, icon: mdi:application-cog }
  - { slug: broadcast-fee, name: Broadcast fee, icon: mdi:radio-tower, ai_deals: false }
  - { slug: medicine, name: Medicines, icon: mdi:pill, ai_deals: false }

# Reused switching blocks
x-telecom: &telecom
  contract_lengths: [0, 12, 24]
  notice_days: 30
  cancel_method: >-
    First term is at most 24 months. After the minimum term the contract runs on monthly and can be cancelled
    with one month's notice (TKG § 56); the new provider can port your number and handle the switch.
  switch_site: https://www.check24.de/
  regulator: https://www.bundesnetzagentur.de/DE/Vportal/start.html
x-energy: &energy
  contract_lengths: [0, 12, 24]
  notice_days: 30
  cancel_method: >-
    Sign up with the new supplier; they cancel the old contract for you. Grundversorgung can be left with two
    weeks' notice; special contracts follow their terms. A price increase gives you a special right to cancel.
  switch_site: https://www.verivox.de/
  regulator: https://www.bundesnetzagentur.de/DE/Vportal/start.html
x-anytime: &anytime
  contract_lengths: [0]
  notice_days: 0
  cancel_method: Cancel in your account settings any time; access usually runs to the end of the paid period.

