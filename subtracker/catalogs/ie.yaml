# Ireland provider catalog, bundled with the add-on.
# Loaded on every start: new providers are added and unedited bundled ones are refreshed.
# Anything you edit, add or hide in the app is kept as you left it.
#
# Switching info is general guidance, not your contract: always check your own terms.
# Plans/prices are left empty on purpose; they go stale fast and are refreshed by the AI deal finder.
captured_at: 2026-11-02

country:
  code: IE
  name: Ireland
  currency: EUR
  settings:
    dps_monthly_cap: 80 # Drug Payment Scheme: max household spend on prescriptions per calendar month (EUR)
    dps_url: https://www.mydps.ie/
    switch_sites:
      - name: bonkers.ie
        url: https://www.bonkers.ie/
      - name: switcher.ie
        url: https://www.switcher.ie/
    regulators:
      telecoms: { name: ComReg, url: https://www.comreg.ie/ }
      energy: { name: CRU, url: https://www.cru.ie/ }

categories:
  - { slug: broadband, name: Broadband, icon: mdi:router-wireless }
  - { slug: mobile, name: Mobile, icon: mdi:cellphone }
  - { slug: electricity, name: Electricity, icon: mdi:flash }
  - { slug: gas, name: Gas, icon: mdi:fire }
  - { slug: bins, name: Bins, icon: mdi:trash-can }
  - { slug: streaming, name: Streaming & TV, icon: mdi:television-play }
  - { slug: software, name: Software & AI, icon: mdi:application-cog }
  - { slug: medicine, name: Medicines, icon: mdi:pill, ai_deals: false }

# Reused switching blocks
x-broadband: &broadband
  contract_lengths: [12, 18, 24]
  notice_days: 30
  cancel_method: Contact the provider; at the end of the minimum term you can leave without a penalty.
  switch_site: https://www.bonkers.ie/compare-broadband-deals/
  regulator: https://www.comreg.ie/
x-mobile: &mobile
  contract_lengths: [0, 12, 24]
  notice_days: 30
  cancel_method: Prepay can stop any time. Bill pay - contact the provider; porting your number to a new network ends the old contract.
  switch_site: https://www.bonkers.ie/compare-mobile-phones/
  regulator: https://www.comreg.ie/
x-energy: &energy
  contract_lengths: [12]
  notice_days: 0
  cancel_method: Sign up with the new supplier; they arrange the switch. Leaving a fixed contract early may cost an exit fee.
  switch_site: https://www.bonkers.ie/compare-gas-electricity-prices/
  regulator: https://www.cru.ie/
x-bins: &bins
  contract_lengths: [12]
  notice_days: 30
  cancel_method: Contact the provider. Collectors are permitted per county, so check who serves your area.
x-anytime: &anytime
  contract_lengths: [0]
  notice_days: 0
  cancel_method: Cancel in your account settings any time; access usually runs to the end of the paid period.

