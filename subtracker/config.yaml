name: SubTracker
version: "0.2.0"
slug: subtracker
description: Track household subscriptions, contracts, bills and medicines. AI finds better deals before renewal.
url: https://github.com/cyberjithu/ha-subscription-tracker
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-sync
panel_title: Subscriptions
homeassistant_api: true
map:
  - homeassistant_config:rw
options:
  ai_provider: none
  anthropic_api_key: ""
  anthropic_model: claude-opus-5-5
  openai_api_key: ""
  openai_model: gpt-5
  ollama_url: ""
  ollama_model: llama3.1
  ha_ai_task_entity: ""
  discovery_interval_days: 30
  deal_search_lead_days: 45
  resend_api_key: ""
  resend_from: ""
  email_notify_service: ""
  install_lovelace_card: true
schema:
  ai_provider: list(none|anthropic|openai|ollama|ha_ai_task)
  anthropic_api_key: password?
  anthropic_model: str?
  openai_api_key: password?
  openai_model: str?
  ollama_url: str?
  ollama_model: str?
  ha_ai_task_entity: str?
  discovery_interval_days: int(0,365)
  deal_search_lead_days: int(1,365)
  resend_api_key: password?
  resend_from: str?
  email_notify_service: str?
  install_lovelace_card: bool
